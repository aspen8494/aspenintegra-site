name: Deploy to aspenintegra.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # ---- Deploy over SFTP (IONOS, port 22) ----
      # Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (required)
      #          FTP_PORT (default 22), FTP_SERVER_DIR (default ./)
      # SamKirkland/FTP-Deploy-Action only speaks ftp/ftps, so IONOS SFTP
      # needs this action instead. Password auth, no SSH key required.
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 22 }}
          local_path: 'dist/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR || './' }}
          delete_remote_files: false

      # ---- Alternative: deploy over SSH/rsync (VPS hosting) ----
      # Uncomment this step (and remove the FTP step) if your host is a VPS.
      # Required secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_TARGET_DIR
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     source: "dist/*"
      #     target: ${{ secrets.SSH_TARGET_DIR }}
      #     strip_components: 1
      #     rm: true
