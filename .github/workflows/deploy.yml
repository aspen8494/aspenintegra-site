name: Deploy to aspenintegra.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # ---- Deploy over SFTP (IONOS) ----
      # Set these repository secrets: Settings → Secrets and variables → Actions
      #   FTP_SERVER    e.g. access-XXXXXXX.<host>.websiteservername.com (from IONOS)
      #   FTP_USERNAME  your IONOS SFTP username
      #   FTP_PASSWORD  your IONOS SFTP password
      # Optional secrets (defaults shown):
      #   FTP_PORT      22
      #   FTP_PROTOCOL  sftp
      #   FTP_SERVER_DIR ./  (IONOS SFTP lands directly in the site root)
      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 22 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'sftp' }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          log-level: minimal

      # ---- Alternative: deploy over SSH/rsync (VPS hosting) ----
      # Uncomment this step (and remove the FTP step) if your host is a VPS.
      # Required secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_TARGET_DIR
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     source: "dist/*"
      #     target: ${{ secrets.SSH_TARGET_DIR }}
      #     strip_components: 1
      #     rm: true
