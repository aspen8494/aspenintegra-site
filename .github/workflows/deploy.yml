name: Deploy to aspenintegra.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Append playground apps to sitemap
        run: python scripts/append_sitemap.py

      # ---- Deploy over SFTP (IONOS, port 22) ----
      # Custom paramiko deploy script that mirrors an interactive `sftp`
      # login: password auth with keyboard-interactive fallback. This is
      # what works manually (`sftp -P 22 user@host`); off-the-shelf
      # password-SFTP actions get "Permission denied" on IONOS.
      # Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (required)
      #          FTP_PORT (default 22), FTP_SERVER_DIR (default ./)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install paramiko
        run: pip install paramiko

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT || '22' }}
          SFTP_REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
          SFTP_LOCAL_DIR: dist
        run: python scripts/deploy_sftp.py

      # ---- Alternative: deploy over SSH/rsync (VPS hosting) ----
      # Uncomment this step (and remove the FTP step) if your host is a VPS.
      # Required secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_TARGET_DIR
      # - name: Deploy via SSH
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     source: "dist/*"
      #     target: ${{ secrets.SSH_TARGET_DIR }}
      #     strip_components: 1
      #     rm: true
